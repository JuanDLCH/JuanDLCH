<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="t d">
<title id="t">Useful AI over impressive demos</title><desc id="d">Footer: a goalkeeper glove dives to catch a curly-brace ball. Off the clock Juandy is a goalkeeper, Linux tinkerer and automation experimenter, based in Medellín.</desc>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.ball{animation:ball 4.2s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes ball{0%{transform:translate(0,0);opacity:0}6%{opacity:1}45%{transform:translate(330px,-70px)}55%,82%{transform:translate(372px,-58px);opacity:1}90%,100%{transform:translate(372px,-58px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4.2s linear infinite}
@keyframes spin{0%{transform:rotate(0)}55%,100%{transform:rotate(540deg)}}
.glove{animation:glove 4.2s ease-in-out infinite}
@keyframes glove{0%,30%{transform:translate(0,0) rotate(0)}52%,80%{transform:translate(-22px,-14px) rotate(-12deg)}95%,100%{transform:translate(0,0) rotate(0)}}
.save{transform-box:fill-box;transform-origin:center;animation:save 4.2s ease-out infinite}
@keyframes save{0%,54%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.12)}64%,82%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.ball{transform:translate(372px,-58px)}.glove{transform:translate(-22px,-14px) rotate(-12deg)}}</style>
