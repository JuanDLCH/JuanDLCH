@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.ok0{animation:ok0 5.5s infinite}@keyframes ok0{0%,7.27%{opacity:0}9.45%,90.91%{opacity:1}96.36%,100%{opacity:0}}
.ok1{animation:ok1 5.5s infinite}@keyframes ok1{0%,23.64%{opacity:0}25.82%,90.91%{opacity:1}96.36%,100%{opacity:0}}
