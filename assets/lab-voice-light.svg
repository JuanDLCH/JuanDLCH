<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="t d">
<title id="t">Voice Lab — talk to Sophie</title><desc id="d">Card linking to a live realtime voice agent demo; an animated waveform and a typed caption.</desc>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.live{transform-box:fill-box;transform-origin:center;animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{opacity:.25;transform:scale(.7)}}
.vb{fill:url(#accent);transform-box:fill-box;transform-origin:center;animation:vb 1.2s ease-in-out infinite}
@keyframes vb{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.cap{animation:cap 8s infinite}
@keyframes cap{0%,7.50%{transform:translateX(0);animation-timing-function:steps(44,end)}37.75%,92.50%{transform:translateX(400.0px)}92.63%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}</style>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6b58ea"/><stop offset=".55" stop-color="#8f5ee8"/><stop offset="1" stop-color="#0c9c84"/></linearGradient>
<clipPath id="clip"><rect width="600" height="340" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="600" height="340" fill="#ffffff"/>
<rect width="600" height="4" fill="url(#accent)"/>
<text x="36" y="52" fill="#0c9c84" font-size="13" font-weight="800" letter-spacing="2">VOICE LAB</text>
<g><rect x="485.6" y="33" width="78.4" height="26" rx="13" fill="none" stroke="#b8cae4"/>
<circle class="live" cx="501.6" cy="46" r="4.5" fill="#e5485c"/>
