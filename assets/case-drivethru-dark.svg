<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Drive-thru voice AI architecture</title><desc id="d">The customer speaks; Deepgram streams speech to text; a Claude agent handles turn-taking, calls the order API, and answers through ElevenLabs voice. The customer can interrupt mid-sentence.</desc>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.flow{stroke-dasharray:2 98;animation:flow 2.4s linear infinite}
@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.march{animation:march 1s linear infinite}@keyframes march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.flow{display:none}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#151f35"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#314160"/></marker>
<marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4d5e7f"/></marker>
<clipPath id="clip"><rect width="1200" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
