<path d="M522 62C600 62 650 90 650 116" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.37s" d="M522 62C600 62 650 90 650 116" pathLength="100" fill="none" stroke="#48dbc0" stroke-width="6" stroke-linecap="round"/>
<path d="M748 140C820 130 860 62 904 62" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.74s" d="M748 140C820 130 860 62 904 62" pathLength="100" fill="none" stroke="#9586fa" stroke-width="6" stroke-linecap="round"/><rect x="783.7" y="92" width="84.60000000000001" height="22" rx="11" fill="#151f35" stroke="#283653"/><text x="826" y="107.5" fill="#8fa2c4" font-size="12" font-weight="600" text-anchor="middle">tool call</text>
<path d="M748 162C820 175 860 250 908 250" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-1.11s" d="M748 162C820 175 860 250 908 250" pathLength="100" fill="none" stroke="#48dbc0" stroke-width="6" stroke-linecap="round"/>
<path d="M908 262C700 312 300 312 150 176" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-1.48s" d="M908 262C700 312 300 312 150 176" pathLength="100" fill="none" stroke="#9586fa" stroke-width="6" stroke-linecap="round"/><rect x="470.3" y="280" width="99.4" height="22" rx="11" fill="#151f35" stroke="#283653"/><text x="520" y="295.5" fill="#8fa2c4" font-size="12" font-weight="600" text-anchor="middle">speaks back</text>
<path d="M244 150H548" fill="none" stroke="#4d5e7f" stroke-width="2" stroke-dasharray="6 6" class="march" marker-end="url(#arrowD)"/><rect x="301.9" y="138" width="188.20000000000002" height="22" rx="11" fill="#151f35" stroke="#283653"/><text x="396" y="153.5" fill="#8fa2c4" font-size="12" font-weight="600" text-anchor="middle">interrupts mid-sentence</text>
