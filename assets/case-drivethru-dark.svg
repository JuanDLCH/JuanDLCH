<text x="1010" y="70" fill="#f3f7ff" font-size="15" font-weight="700" text-anchor="middle">Order / POS API</text>
</g>
<g><rect x="915" y="222" width="190" height="56" rx="10" fill="#111b31" stroke="#314160" stroke-width="1.5"/>
<text x="1010" y="247" fill="#f3f7ff" font-size="15" font-weight="700" text-anchor="middle">ElevenLabs</text>
<text x="1010" y="266" fill="#8fa2c4" font-size="12.5" text-anchor="middle">voice</text></g>
</g>
</svg>
