<title id="t">Juan Diego Londoño (Juandy) — I build AI that listens, reasons and acts</title><desc id="d">Animated banner: the tagline appears word by word while data flows between an AI agent and its voice, tools, retrieval and cloud nodes.</desc>
<style>
text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.w0{animation:w0 10s infinite}@keyframes w0{0%,5.00%{fill-opacity:0}9.50%,86.00%{fill-opacity:1}92.00%,100%{fill-opacity:0}}.w1{animation:w1 10s infinite}@keyframes w1{0%,17.00%{fill-opacity:0}21.50%,86.00%{fill-opacity:1}92.00%,100%{fill-opacity:0}}.w2{animation:w2 10s infinite}@keyframes w2{0%,29.00%{fill-opacity:0}33.50%,86.00%{fill-opacity:1}92.00%,100%{fill-opacity:0}}.g0{animation:g0 10s infinite}@keyframes g0{0%,5.00%{opacity:0}9.00%{opacity:1}27.00%,100%{opacity:0}}.g1{animation:g1 10s infinite}@keyframes g1{0%,17.00%{opacity:0}21.00%{opacity:1}39.00%,100%{opacity:0}}.g2{animation:g2 10s infinite}@keyframes g2{0%,29.00%{opacity:0}33.00%{opacity:1}51.00%,100%{opacity:0}}
.flow{stroke-dasharray:3 97;animation:flow 2.6s linear infinite}
.flow.b{animation-delay:-1.3s}
@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.bar{fill:url(#accent);transform-box:fill-box;transform-origin:center;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.cursor{animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.flow,.g0,.g1,.g2{display:none}}</style>
