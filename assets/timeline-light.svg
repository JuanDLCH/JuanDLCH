<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
<title id="t">Career timeline, 2022 to today</title><desc id="d">2022: Software that runs a business (full stack · stellion tech); 2023: Systems that talk to each other (full stack · trade ec); 2024: AI that ships to production (lead ai engineer · trade ec); 2026: What’s next (ai engineer)</desc>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.draw{stroke-dasharray:100;animation:draw 2.6s cubic-bezier(.6,.1,.3,1) both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out 2.6s infinite both}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.s0{animation:pop .5s ease-out 0.15s both}
.s1{animation:pop .5s ease-out 0.92s both}
.s2{animation:pop .5s ease-out 1.68s both}
.s3{animation:pop .5s ease-out 2.45s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1050" y2="0"><stop stop-color="#6b58ea"/><stop offset=".55" stop-color="#8f5ee8"/><stop offset="1" stop-color="#0c9c84"/></linearGradient></defs>
<path d="M40 88H1160" stroke="#c3d4ea" stroke-width="3" stroke-linecap="round"/>
<path class="draw" d="M40 88H1050" pathLength="100" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
<path d="M1064 88H1170" stroke="#0c9c84" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity=".6"/>
<g class="s0">

<circle cx="150" cy="88" r="8" fill="#ffffff" stroke="#6b58ea" stroke-width="3"/>
<text x="150" y="56" fill="#6b58ea" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="mono">2022</text>
<text x="150" y="134" fill="#14243c" font-size="17.5" font-weight="800" text-anchor="middle" letter-spacing="-.2">Software that runs a business</text>
<text x="150" y="160" fill="#6b58ea" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="1.6">FULL STACK · STELLION TECH</text>
<text x="150" y="188" fill="#506684" font-size="14.5" text-anchor="middle">Two ERP systems,</text>
<text x="150" y="209" fill="#506684" font-size="14.5" text-anchor="middle">end to end</text>
</g>
<g class="s1">

<circle cx="450" cy="88" r="8" fill="#ffffff" stroke="#6b58ea" stroke-width="3"/>
<text x="450" y="56" fill="#6b58ea" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="mono">2023</text>
<text x="450" y="134" fill="#14243c" font-size="17.5" font-weight="800" text-anchor="middle" letter-spacing="-.2">Systems that talk to each other</text>
<text x="450" y="160" fill="#6b58ea" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="1.6">FULL STACK · TRADE EC</text>
<text x="450" y="188" fill="#506684" font-size="14.5" text-anchor="middle">APIs, integrations</text>
<text x="450" y="209" fill="#506684" font-size="14.5" text-anchor="middle">and data on AWS</text>
</g>
<g class="s2">

<circle cx="750" cy="88" r="8" fill="#ffffff" stroke="#6b58ea" stroke-width="3"/>
<text x="750" y="56" fill="#6b58ea" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="mono">2024</text>
<text x="750" y="134" fill="#14243c" font-size="17.5" font-weight="800" text-anchor="middle" letter-spacing="-.2">AI that ships to production</text>
<text x="750" y="160" fill="#6b58ea" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="1.6">LEAD AI ENGINEER · TRADE EC</text>
<text x="750" y="188" fill="#506684" font-size="14.5" text-anchor="middle">Led the team: agents, voice,</text>
<text x="750" y="209" fill="#506684" font-size="14.5" text-anchor="middle">document AI, AWS architecture</text>
</g>
<g class="s3">
<circle class="ring" cx="1050" cy="88" r="11" fill="none" stroke="#0c9c84" stroke-width="2"/>
<circle cx="1050" cy="88" r="10" fill="#0c9c84" stroke="#0c9c84" stroke-width="3"/>
<text x="1050" y="56" fill="#0c9c84" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="mono">2026</text>
<text x="1050" y="134" fill="#14243c" font-size="17.5" font-weight="800" text-anchor="middle" letter-spacing="-.2">What’s next</text>
<text x="1050" y="160" fill="#0c9c84" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="1.6">AI ENGINEER</text>
<text x="1050" y="188" fill="#506684" font-size="14.5" text-anchor="middle">A new chapter starts soon.</text>
<text x="1050" y="209" fill="#506684" font-size="14.5" text-anchor="middle">More on that shortly.</text>
</g>
</svg>
