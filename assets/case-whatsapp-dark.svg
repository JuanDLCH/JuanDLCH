<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Insurance assistant on WhatsApp</title><desc id="d">A WhatsApp user writes; Meta WhatsApp Cloud API sends a webhook to the conversation flows, which handle policy lookups, coverage checks and claims against the insurer systems, then reply.</desc>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.flow{stroke-dasharray:2 98;animation:flow 2.4s linear infinite}
@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.march{animation:march 1s linear infinite}@keyframes march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.flow{display:none}}</style>
