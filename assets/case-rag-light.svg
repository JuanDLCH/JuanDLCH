<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
<title id="t">Cinema assistant retrieval loop</title><desc id="d">A question is rewritten, searched with hybrid keyword and vector search, reranked, and checked by a validator agent; grounded answers become recommendations, otherwise the loop tries again.</desc>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.flow{stroke-dasharray:2 98;animation:flow 2.4s linear infinite}
@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.march{animation:march 1s linear infinite}@keyframes march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.flow{display:none}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#e9f1ff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8cae4"/></marker>
<marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aaccb"/></marker>
<clipPath id="clip"><rect width="1200" height="230" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="230" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="228" rx="15" stroke="#c3d4ea" stroke-width="2" fill="none"/>
<path d="M160 90H198" fill="none" stroke="#b8cae4" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.00s" d="M160 90H198" pathLength="100" fill="none" stroke="#6b58ea" stroke-width="6" stroke-linecap="round"/>
<path d="M370 90H398" fill="none" stroke="#b8cae4" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.37s" d="M370 90H398" pathLength="100" fill="none" stroke="#0c9c84" stroke-width="6" stroke-linecap="round"/>
<path d="M580 90H608" fill="none" stroke="#b8cae4" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.74s" d="M580 90H608" pathLength="100" fill="none" stroke="#6b58ea" stroke-width="6" stroke-linecap="round"/>
<path d="M750 90H778" fill="none" stroke="#b8cae4" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-1.11s" d="M750 90H778" pathLength="100" fill="none" stroke="#0c9c84" stroke-width="6" stroke-linecap="round"/>
<path d="M960 90H1003" fill="none" stroke="#b8cae4" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-1.48s" d="M960 90H1003" pathLength="100" fill="none" stroke="#6b58ea" stroke-width="6" stroke-linecap="round"/><rect x="961.9" y="54" width="40.2" height="22" rx="11" fill="#e9f1ff" stroke="#c3d4ea"/><text x="982" y="69.5" fill="#506684" font-size="12" font-weight="600" text-anchor="middle">yes</text>
<path d="M870 118C870 200 285 200 285 114" fill="none" stroke="#9aaccb" stroke-width="2" stroke-dasharray="6 6" class="march" marker-end="url(#arrowD)"/><rect x="520.9" y="166" width="114.2" height="22" rx="11" fill="#e9f1ff" stroke="#c3d4ea"/><text x="578" y="181.5" fill="#506684" font-size="12" font-weight="600" text-anchor="middle">no, try again</text>
<g><rect x="30" y="68" width="130" height="44" rx="22" fill="#ffffff" stroke="#0c9c84" stroke-width="1.5"/>
<text x="95" y="95" fill="#14243c" font-size="15" font-weight="700" text-anchor="middle">Question</text>
</g>
<g><rect x="200" y="68" width="170" height="44" rx="10" fill="#ffffff" stroke="#b8cae4" stroke-width="1.5"/>
<text x="285" y="95" fill="#14243c" font-size="15" font-weight="700" text-anchor="middle">Query rewrite</text>
</g>
<g><rect x="400" y="62" width="180" height="56" rx="10" fill="#ffffff" stroke="#b8cae4" stroke-width="1.5"/>
<text x="490" y="87" fill="#14243c" font-size="15" font-weight="700" text-anchor="middle">Hybrid search</text>
<text x="490" y="106" fill="#506684" font-size="12.5" text-anchor="middle">keyword + vector</text></g>
<g><rect x="610" y="68" width="140" height="44" rx="10" fill="#ffffff" stroke="#b8cae4" stroke-width="1.5"/>
<text x="680" y="95" fill="#14243c" font-size="15" font-weight="700" text-anchor="middle">Rerank</text>
</g>
<g><rect x="780" y="62" width="180" height="56" rx="10" fill="#ffffff" stroke="#6b58ea" stroke-width="2"/>
<text x="870" y="87" fill="#14243c" font-size="15" font-weight="700" text-anchor="middle">Validator agent</text>
<text x="870" y="106" fill="#506684" font-size="12.5" text-anchor="middle">grounded?</text></g>
<g><rect x="1005" y="62" width="170" height="56" rx="28" fill="#ffffff" stroke="#0c9c84" stroke-width="1.5"/>
<text x="1090" y="87" fill="#14243c" font-size="15" font-weight="700" text-anchor="middle">Answer +</text>
<text x="1090" y="106" fill="#506684" font-size="12.5" text-anchor="middle">recommendation</text></g>
</g>
</svg>
