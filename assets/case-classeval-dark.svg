<path d="M415 85H456" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.37s" d="M415 85H456" pathLength="100" fill="none" stroke="#48dbc0" stroke-width="6" stroke-linecap="round"/>
<path d="M633 85H678" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-0.74s" d="M633 85H678" pathLength="100" fill="none" stroke="#9586fa" stroke-width="6" stroke-linecap="round"/>
<path d="M850 85H888" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-1.11s" d="M850 85H888" pathLength="100" fill="none" stroke="#48dbc0" stroke-width="6" stroke-linecap="round"/>
<path d="M1040 85H1048" fill="none" stroke="#314160" stroke-width="2" marker-end="url(#arrow)"/><path class="flow" style="animation-delay:-1.48s" d="M1040 85H1048" pathLength="100" fill="none" stroke="#9586fa" stroke-width="6" stroke-linecap="round"/>
<g><rect x="22.5" y="63" width="175" height="44" rx="22" fill="#111b31" stroke="#48dbc0" stroke-width="1.5"/>
<text x="110" y="90" fill="#f3f7ff" font-size="15" font-weight="700" text-anchor="middle">Class recording</text>
</g>
<g><rect x="245" y="57" width="170" height="56" rx="10" fill="#111b31" stroke="#314160" stroke-width="1.5"/>
<text x="330" y="82" fill="#f3f7ff" font-size="15" font-weight="700" text-anchor="middle">Amazon</text>
<text x="330" y="101" fill="#8fa2c4" font-size="12.5" text-anchor="middle">Transcribe</text></g>
<g><rect x="457.5" y="57" width="175" height="56" rx="10" fill="#111b31" stroke="#314160" stroke-width="1.5"/>
<text x="545" y="82" fill="#f3f7ff" font-size="15" font-weight="700" text-anchor="middle">Step Functions</text>
